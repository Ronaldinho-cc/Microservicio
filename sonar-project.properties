# SonarCloud Configuration
sonar.projectKey=366ba08a8b01e3ccd5bccae92ecb89466fceef01
sonar.organization=mariaavilaconde
sonar.projectName=Water Quality Microservice
sonar.projectVersion=1.0

# Source code location
sonar.sources=src/main/java
sonar.tests=src/test/java

# Java specific properties
sonar.java.source=17
sonar.java.target=17
sonar.java.binaries=target/classes
sonar.java.test.binaries=target/test-classes

# Coverage reporting
sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml
sonar.junit.reportPaths=target/surefire-reports

# Encoding
sonar.sourceEncoding=UTF-8

# Exclusions
sonar.exclusions=**/target/**,**/node_modules/**,**/*.min.js,**/vendor/**
sonar.test.exclusions=**/target/**

# Quality gate
sonar.qualitygate.wait=true
