# Test configuration
spring.main.web-application-type=none

# Disable MongoDB auto-configuration for basic tests
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.data.mongo.MongoDataAutoConfiguration,org.springframework.boot.autoconfigure.data.mongo.MongoReactiveDataAutoConfiguration,de.flapdoodle.embed.mongo.spring.autoconfigure.EmbeddedMongoAutoConfiguration

# Logging configuration
logging.level.org.springframework.data.mongodb=ERROR
logging.level.org.mongodb=ERROR
logging.level.de.flapdoodle.embed.mongo=ERROR
logging.level.org.springframework.boot.autoconfigure=ERROR

# Security configuration for tests
spring.security.user.name=test
spring.security.user.password=test
spring.security.user.roles=USER