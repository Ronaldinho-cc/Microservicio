# Configuración MongoDB para pruebas (embebido)
spring:
  data:
    mongodb:
      database: test_water_quality
      port: 0  # Puerto aleatorio para MongoDB embebido

de:
  flapdoodle:
    mongodb:
      embedded:
        version: 4.4.18

spring:
  mongodb:
    embedded:
      version: 4.4.18

# Configuración de logging para pruebas
logging:
  level:
    pe.edu.vallegrande: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG

# Configuración de seguridad para pruebas
security:
  jwt:
    secret: test-secret-key-for-testing-purposes-only
    expiration: 3600000

# Configuración de servicios externos para pruebas (mock)
external:
  services:
    user-service:
      url: http://localhost:8081
      enabled: false
    organization-service:
      url: http://localhost:8082  
      enabled: false